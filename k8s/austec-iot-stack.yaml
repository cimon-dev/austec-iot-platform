apiVersion: v1
kind: Namespace
metadata:
  name: austec-iot-prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: austec-backend-deployment
  namespace: austec-iot-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: austec-backend
  template:
    metadata:
      labels:
        app: austec-backend
    spec:
      containers:
        - name: backend
          image: austec-cr.vietnam.io/iot-backend:v2.0.0
          ports:
            - containerPort: 4000
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: austec-backend-service
  namespace: austec-iot-prod
spec:
  selector:
    app: austec-backend
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: austec-web-admin-deployment
  namespace: austec-iot-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: austec-web-admin
  template:
    metadata:
      labels:
        app: austec-web-admin
    spec:
      containers:
        - name: web-admin
          image: austec-cr.vietnam.io/web-admin:v2.0.0
          ports:
            - containerPort: 3030
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: austec-web-admin-service
  namespace: austec-iot-prod
spec:
  selector:
    app: austec-web-admin
  ports:
    - port: 3030
      targetPort: 3030
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: austec-iot-ingress
  namespace: austec-iot-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "austec-backend-service"
spec:
  tls:
    - hosts:
        - admin.austec.vn
        - api.austec.vn
      secretName: austec-tls-secret
  rules:
    - host: admin.austec.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: austec-web-admin-service
                port:
                  number: 3030
    - host: api.austec.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: austec-backend-service
                port:
                  number: 4000
