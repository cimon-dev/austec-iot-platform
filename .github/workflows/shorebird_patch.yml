name: Shorebird Patch iOS

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile-app/lib/**'
      - 'mobile-app/assets/**'
      - 'mobile-app/pubspec.yaml'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version to patch (leave empty for latest)'
        required: false
        type: string
        default: 'latest'

jobs:
  patch-ios:
    name: Patch iOS via Shorebird
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Run Shorebird Patch iOS
        working-directory: mobile-app
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          TARGET_VERSION="${{ inputs.release_version }}"
          if [ -z "$TARGET_VERSION" ]; then
            TARGET_VERSION="latest"
          fi
          shorebird patch ios \
            --release-version "$TARGET_VERSION" \
            --no-codesign \
            --no-confirm \
            --allow-native-diffs \
            --allow-asset-diffs
