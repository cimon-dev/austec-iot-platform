name: Shorebird Patch iOS

trên:
  push:
    nhánh:
      - main
      - master
    đường dẫn:
      - 'mobile-app/lib/**'
      - 'mobile-app/assets/**'
      - 'mobile-app/pubspec.yaml'
  Workflow_dispatch:
    đầu vào:
      Release_version:
        mô tả: 'Phiên bản phát hành để vá lỗi (để trống cho phiên bản mới nhất)'
        bắt buộc: sai
        gõ: chuỗi
        mặc định: 'mới nhất'

công việc:
  patch-ios:
    tên: Patch iOS qua Shorebird
    chạy trên: macos-mới nhất

    bước:
      - tên: Mã Checkout
        sử dụng: actions/checkout@v4

      - tên: Thiết lập Shorebird
        sử dụng: shorebirdtech/setup-shorebird@v1
        với:
          cache: true

      - tên: Chạy Shorebird Patch iOS
        Working-directory: mobile-app
        env:
          SHOREBIRD_TOKEN: ${{ secret.SHOREBIRD_TOKEN }}
        run: |
          TARGET_VERSION="${{ input.release_version }}"
          if [ -z "$TARGET_VERSION" ]; sau đó
            TARGET_VERSION="latest"
          fi
          Shorebird patch ios \
            --release-version "$TARGET_VERSION" \
            --no-codesign \
            --no-confirm \
            --allow-native-diffs \
            --allow-asset-diffs
