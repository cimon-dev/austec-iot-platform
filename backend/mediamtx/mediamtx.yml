# =====================================================================
# CẤU HÌNH MEDIAMTX STREAMING SERVER (LOCAL WINDOWS / VPS DOCKER)
# Phiên bản tương thích MediaMTX v1.21.x + FFmpeg (bluenviron/mediamtx:latest-ffmpeg)
# Toàn bộ IP / Port / Webhook đọc từ file .env tập trung qua biến MTX_* của Docker Compose!
# =====================================================================

logLevel: info
readTimeout: 20s
writeTimeout: 20s

# 1. CỔNG NHẬN LUỒNG RTSP TỪ CAMERA ESP32-CAM (PUSH vào raw/<hardwareId>)
# Ghi đè động qua MTX_RTSPADDRESS trong docker-compose.yml (.env)
rtsp: yes
rtspTransports: [tcp, udp]

# 2. CỔNG PHÁT WEBRTC ĐỘ TRỄ SIÊU THẤP CHO MOBILE APP & TRÌNH DUYỆT (< 300ms)
# Ghi đè động MTX_WEBRTCADDITIONALHOSTS=${MEDIAMTX_HOST} từ .env (không fix cứng IP ở đây)
webrtc: yes

# 3. CỔNG HLS CHO TRÌNH DUYỆT WEB ADMIN
hls: yes
hlsAlwaysRemux: true

# 4. BẢO MẬT: XÁC THỰC QUA WEBHOOK VỚI BACKEND AUSTEC
# Ghi đè động qua MTX_AUTHHTTPADDRESS=${MEDIAMTX_AUTH_URL} từ .env
authMethod: http

# 5. ĐƯỜNG DẪN ĐỘNG CHO TỪNG CAMERA
paths:
  # Kênh gốc ESP32-CAM OV2640 đẩy RTSP MJPEG lên (rtsp://<MEDIAMTX_HOST>:8554/raw/<hardwareId>)
  # Tự động dùng FFmpeg chuyển mã MJPEG -> H.264 Low-Latency sang live/<hardwareId> để chạy WebRTC/HLS/RTSP
  "~^raw/(.+)$":
    runOnAvailable: 'ffmpeg -loglevel warning -rtsp_transport tcp -use_wallclock_as_timestamps 1 -fflags +nobuffer+genpts+discardcorrupt -flags low_delay -analyzeduration 1000000 -probesize 100000 -thread_queue_size 512 -i rtsp://127.0.0.1:8554/$MTX_PATH -an -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -r 15 -g 30 -b:v 800k -maxrate 1200k -bufsize 600k -pkt_size 1300 -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:8554/live/$G1'
    runOnAvailableRestart: true

  # Kênh chuẩn sau chuyển mã để Mobile App / Web / VLC xem tại live/<hardwareId>
  # Biến $MEDIAMTX_HOOK_BASE_URL được truyền vào container từ file .env
  "~^live/(.+)$":
    runOnOnline: 'sh -c "wget -qO- --post-data=\"\" \"${MEDIAMTX_HOOK_BASE_URL}/publish?path=${MTX_PATH}\" >/dev/null 2>&1"'
    runOnOffline: 'sh -c "wget -qO- --post-data=\"\" \"${MEDIAMTX_HOOK_BASE_URL}/unpublish?path=${MTX_PATH}\" >/dev/null 2>&1"'
