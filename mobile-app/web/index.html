<!DOCTYPE html>
<html>
<head>
  <!--

    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="austec_green_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>austec_green_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.austecWebBle = {
      isSupported: function() {
        return !!(navigator && navigator.bluetooth && typeof navigator.bluetooth.requestDevice === 'function');
      },
      requestDevice: function() {
        return new Promise(function(resolve) {
          if (!navigator || !navigator.bluetooth || !navigator.bluetooth.requestDevice) {
            resolve(JSON.stringify({ supported: false, error: 'Web Bluetooth không hỗ trợ trên trình duyệt này' }));
            return;
          }
          navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [
              '6e400001-b5a3-f393-e0a9-e50e24dcca9e', // Cửa cuốn
              '4fafc201-1fb5-459e-8fcc-c5c9c331914b', // Camera AI
              '4faac861-11a3-45d6-964d-c57406320509'  // Ổ cắm thông minh OCAM
            ]
          }).then(function(device) {
            resolve(JSON.stringify({
              supported: true,
              success: true,
              id: device.id,
              name: device.name || ('ESP32-' + device.id.slice(0, 6)),
              hardwareId: device.name || ('ESP32-' + device.id.slice(0, 6))
            }));
          }).catch(function(err) {
            console.warn('[WebBLE] Lỗi hoặc người dùng hủy:', err);
            resolve(JSON.stringify({ supported: true, success: false, error: (err && err.message) ? err.message : 'Cancelled' }));
          });
        });
      },
      sendBleOnboardPayload: function(payloadString, targetServiceUuid, targetRxUuid) {
        return new Promise(function(resolve) {
          if (!navigator || !navigator.bluetooth || !navigator.bluetooth.requestDevice) {
            resolve(JSON.stringify({ supported: false, success: false, error: 'Web Bluetooth không hỗ trợ trên trình duyệt này' }));
            return;
          }
          var allServices = [
            '6e400001-b5a3-f393-e0a9-e50e24dcca9e',
            '4fafc201-1fb5-459e-8fcc-c5c9c331914b',
            '4faac861-11a3-45d6-964d-c57406320509'
          ];
          if (targetServiceUuid && allServices.indexOf(targetServiceUuid.toLowerCase()) === -1) {
            allServices.push(targetServiceUuid.toLowerCase());
          }

          navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: allServices
          }).then(function(device) {
            return device.gatt.connect();
          }).then(async function(server) {
            var service = null;
            var rxChar = null;
            var servicesToTry = targetServiceUuid ? [targetServiceUuid.toLowerCase()].concat(allServices) : allServices;
            for (var i = 0; i < servicesToTry.length; i++) {
              try {
                service = await server.getPrimaryService(servicesToTry[i]);
                if (service) break;
              } catch (_) {}
            }
            if (!service) throw new Error('Không tìm thấy Service BLE tương thích trên bo mạch');

            var chars = await service.getCharacteristics();
            for (var j = 0; j < chars.length; j++) {
              var c = chars[j];
              var cUuid = c.uuid.toLowerCase();
              if (targetRxUuid && cUuid.indexOf(targetRxUuid.toLowerCase().replace(/-/g, '')) !== -1) {
                rxChar = c;
                break;
              }
              if (cUuid.indexOf('6e400002') !== -1 || cUuid.indexOf('bea5c122') !== -1 || cUuid.indexOf('bea5a000') !== -1) {
                rxChar = c;
                break;
              }
              if (c.properties.write || c.properties.writeWithoutResponse) {
                rxChar = c;
              }
            }
            if (!rxChar) throw new Error('Không tìm thấy Characteristic ghi dữ liệu BLE');

            var encoder = new TextEncoder();
            var data = encoder.encode(payloadString);

            // Đăng ký nhận phản hồi xác thực Wi-Fi từ bo mạch ESP32
            var checkWifiPromise = new Promise(function(notifyResolve) {
              var onNotify = function(event) {
                try {
                  var val = new TextDecoder().decode(event.target.value);
                  console.log('[WebBLE Bo Mạch Phản Hồi]:', val);
                  if (val.indexOf('WIFI_FAIL') !== -1) {
                    cleanup();
                    notifyResolve({
                      success: false,
                      isWrongWifi: true,
                      error: 'Mật khẩu Wi-Fi không chính xác hoặc bo mạch không kết nối được tới Router này!'
                    });
                  } else if (val.indexOf('WIFI_OK') !== -1 || val.indexOf('PAIRED_OK') !== -1) {
                    cleanup();
                    notifyResolve({
                      success: true,
                      isWrongWifi: false,
                      message: 'Bo mạch đã xác thực mật khẩu Wi-Fi thành công!'
                    });
                  }
                } catch (_) {}
              };

              var timer = setTimeout(function() {
                cleanup();
                notifyResolve({ success: true, isWrongWifi: false, message: 'Đã nạp gói tin cấu hình Wi-Fi' });
              }, 9500);

              var cleanup = function() {
                clearTimeout(timer);
                try {
                  rxChar.removeEventListener('characteristicvaluechanged', onNotify);
                } catch (_) {}
              };

              if (rxChar.properties.notify) {
                rxChar.addEventListener('characteristicvaluechanged', onNotify);
                rxChar.startNotifications().catch(function(_) {});
              }
            });

            return rxChar.writeValue(data).then(function() {
              return checkWifiPromise;
            });
          }).then(function(result) {
            resolve(JSON.stringify(result || { success: true }));
          }).catch(function(err) {
            console.warn('[WebBLE] Lỗi ghi Characteristic BLE:', err);
            resolve(JSON.stringify({ success: false, error: (err && err.message) ? err.message : 'Lỗi kết nối BLE' }));
          });
        });
      }
    };

    window.austecLocation = {
      isSupported: function() {
        return !!(navigator && navigator.geolocation);
      },
      getCurrentPosition: function() {
        return new Promise(function(resolve) {
          if (!navigator || !navigator.geolocation) {
            resolve(JSON.stringify({ supported: false, success: false, error: 'Thiết bị/trình duyệt không hỗ trợ Geolocation' }));
            return;
          }
          navigator.geolocation.getCurrentPosition(
            function(pos) {
              resolve(JSON.stringify({
                supported: true,
                success: true,
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                accuracy: pos.coords.accuracy
              }));
            },
            function(err) {
              console.warn('[Geolocation] Lỗi định vị GPS:', err);
              var msg = 'Không thể lấy vị trí từ thiết bị';
              if (err.code === 1) msg = 'Quyền truy cập vị trí bị từ chối trên thiết bị';
              else if (err.code === 2) msg = 'Không tìm thấy tín hiệu vị trí từ thiết bị';
              else if (err.code === 3) msg = 'Hết thời gian chờ định vị';
              resolve(JSON.stringify({
                supported: true,
                success: false,
                code: err.code,
                error: msg
              }));
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
          );
        });
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
