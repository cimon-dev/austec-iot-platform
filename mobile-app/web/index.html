<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="austec_green_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>austec_green_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.austecWebBle = {
      isSupported: function() {
        return !!(navigator && navigator.bluetooth && typeof navigator.bluetooth.requestDevice === 'function');
      },
      requestDevice: function() {
        return new Promise(function(resolve) {
          if (!navigator || !navigator.bluetooth || !navigator.bluetooth.requestDevice) {
            resolve(JSON.stringify({ supported: false, error: 'Web Bluetooth không hỗ trợ trên trình duyệt này' }));
            return;
          }
          navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
          }).then(function(device) {
            resolve(JSON.stringify({
              supported: true,
              success: true,
              id: device.id,
              name: device.name || ('ESP32-' + device.id.slice(0, 6)),
              hardwareId: device.name || ('ESP32-' + device.id.slice(0, 6))
            }));
          }).catch(function(err) {
            console.warn('[WebBLE] Lỗi hoặc người dùng hủy:', err);
            resolve(JSON.stringify({ supported: true, success: false, error: (err && err.message) ? err.message : 'Cancelled' }));
          });
        });
      },
      sendBleOnboardPayload: function(payloadString) {
        return new Promise(function(resolve) {
          if (!navigator || !navigator.bluetooth || !navigator.bluetooth.requestDevice) {
            resolve(JSON.stringify({ supported: false, success: false, error: 'Web Bluetooth không hỗ trợ trên trình duyệt này' }));
            return;
          }
          var SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
          var RX_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
          
          navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [SERVICE_UUID]
          }).then(function(device) {
            return device.gatt.connect();
          }).then(function(server) {
            return server.getPrimaryService(SERVICE_UUID);
          }).then(function(service) {
            return service.getCharacteristic(RX_UUID);
          }).then(function(characteristic) {
            var encoder = new TextEncoder();
            var data = encoder.encode(payloadString);
            return characteristic.writeValue(data);
          }).then(function() {
            resolve(JSON.stringify({ success: true, message: 'Đã truyền gói tin onboard thành công qua BLE!' }));
          }).catch(function(err) {
            console.warn('[WebBLE] Lỗi ghi Characteristic BLE:', err);
            resolve(JSON.stringify({ success: false, error: (err && err.message) ? err.message : 'Lỗi kết nối BLE' }));
          });
        });
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
