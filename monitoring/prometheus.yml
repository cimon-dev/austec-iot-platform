global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "austec-iot-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["iot-backend:4000"]

  - job_name: "emqx-cluster"
    metrics_path: "/api/v5/prometheus/stats"
    static_configs:
      - targets: ["emqx-broker:18083"]

  - job_name: "redis-cache"
    static_configs:
      - targets: ["redis-hot-cache:6379"]
